<text x="20" y="30" font-size="15" font-weight="bold">NOTIONAL FLOOR PLANS – 2-BED HOUSE vs 4-PERSON HMO (concept only)</text>
<text x="20" y="48" font-size="11" fill="#c00">Drawn at 40 px per metre. Each floor is a notional 7.3 × 5.5 m internal block (≈40 m²), long side to the street. NOT fitted to the site.</text>
<text x="20" y="62" font-size="11" fill="#c00">Plot size, levels and No.1's windows are [TO BE SURVEYED]. Room sizes are design targets, not measurements.</text>
<text x="20" y="80" font-size="10">2-bed: GIA ≈ 80 m² (NDSS 2b4p min 79); both doubles 11.55 m² × 2.75 m. HMO: bedrooms 6.6–8.3 m² (licensing min 6.51 m²; below NDSS 7.5 m² single).</text>
