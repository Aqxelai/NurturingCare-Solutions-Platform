<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Arial,Helvetica,sans-serif">
<rect width="1000" height="420" fill="#fff"/><rect x="4" y="4" width="992" height="412" fill="none" stroke="#000" stroke-width="2"/>
<text x="20" y="30" font-size="15" font-weight="bold">STREET SCENE ALONG SANDYHILL ROAD – DIAGRAMMATIC, NOT TO SCALE</text>
<text x="20" y="48" font-size="11" fill="#c00">Drawn from site photos. All heights, widths and levels [TO BE SURVEYED]. Replace with surveyed 1:200 elevation (sheet 11).</text>
<!-- sky/ground -->
<rect x="20" y="60" width="960" height="270" fill="#f3f7fb"/>
<!-- footway and road -->
<rect x="20" y="330" width="960" height="14" fill="#ccc"/><rect x="20" y="344" width="960" height="40" fill="#999"/>
<text x="500" y="370" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">SANDYHILL ROAD (west to the left, Cleethorpes Avenue to the right)</text>
<!-- boundary wall line -->
<rect x="20" y="318" width="960" height="12" fill="#b5654a" stroke="#6b3a2a"/>
<!-- west neighbours: raised gardens -->
<polygon points="20,318 20,270 370,270 370,318" fill="#c9d8b0"/>
<rect x="50" y="170" width="150" height="100" fill="#d9b9a0" stroke="#444" stroke-width="2"/>
<polygon points="40,170 125,120 210,170" fill="#7a6e66" stroke="#444" stroke-width="2"/>
<rect x="210" y="180" width="150" height="90" fill="#e9e4d8" stroke="#444" stroke-width="2"/>
<polygon points="200,180 285,135 370,180" fill="#6c6a68" stroke="#444" stroke-width="2"/>
<text x="205" y="230" font-size="11" text-anchor="middle">WEST NEIGHBOURS</text>
<text x="205" y="244" font-size="10" text-anchor="middle">semis, set back behind</text><text x="205" y="257" font-size="10" text-anchor="middle">raised front gardens</text>
<!-- proposed house zone -->
<polygon points="400,318 400,250 700,225 700,318" fill="#eef3e8" stroke="#7a9a5a" stroke-width="2"/>
<text x="550" y="300" font-size="11" text-anchor="middle">grass bank behind low brick wall</text>
<rect x="420" y="130" width="150" height="110" fill="#c9583f" fill-opacity=".3" stroke="#222" stroke-width="3" stroke-dasharray="8 4"/>
<polygon points="410,130 495,85 580,130" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="8 4"/>
<text x="495" y="185" font-size="11" font-weight="bold" text-anchor="middle">PROPOSED HOUSE (zone)</text>
<text x="495" y="200" font-size="10" text-anchor="middle">height/set-back by option</text>
<text x="495" y="214" font-size="10" text-anchor="middle">[TO BE SURVEYED]</text>
<!-- No.1 gable -->
<rect x="720" y="150" width="130" height="150" fill="#8a5a44" stroke="#444" stroke-width="2"/>
<polygon points="710,150 785,95 860,150" fill="#5a4a44" stroke="#444" stroke-width="2"/>
<rect x="770" y="178" width="36" height="26" fill="#cde" stroke="#222"/><rect x="772" y="262" width="30" height="22" fill="#cde" stroke="#222" stroke-dasharray="3 2"/>
<text x="785" y="320" font-size="10" text-anchor="middle" fill="#fff"></text>
<text x="840" y="190" font-size="10">first-floor</text><text x="840" y="203" font-size="10">window</text>
<text x="840" y="270" font-size="10">ground-floor</text><text x="840" y="283" font-size="10">window (behind shrub)</text>
<text x="785" y="80" font-size="11" font-weight="bold" text-anchor="middle">No.1 CLEETHORPES AVE (gable)</text>
<!-- light column -->
<line x1="660" y1="110" x2="660" y2="330" stroke="#666" stroke-width="4"/><text x="668" y="125" font-size="10">street light</text>
<!-- hedge -->
<ellipse cx="640" cy="260" rx="70" ry="30" fill="#4d7a3a" fill-opacity=".7"/><text x="640" y="265" font-size="10" text-anchor="middle" fill="#fff">hedge</text>
</svg>
