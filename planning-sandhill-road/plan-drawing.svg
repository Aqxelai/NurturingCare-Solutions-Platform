<text x="40" y="610" font-size="15" text-anchor="start" font-weight="bold" fill="#000">5. PROPOSAL SUMMARY</text>
<text x="40" y="640" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Site: land adjacent to 1 Cleethorpes Avenue / Sandhill Road, Blackley, Manchester</text>
<text x="40" y="662" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Proposal: 1 no. 4-bedroom detached dwelling (Use Class C3)</text>
<text x="40" y="684" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Orientation: front door and principal windows face Sandhill Road</text>
<text x="40" y="706" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Footprint approx. 8.2 m x 6.8 m; two storeys; GIA approx. 110 m²</text>
<text x="40" y="728" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Parking: 1 off-street space, on the right of the plot, dropped-kerb access from Sandhill Road</text>
<text x="40" y="750" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Amenity: private garden to side and rear (approx. 80–100 m²)</text>
<text x="40" y="772" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Boundaries: rear bushes retained; low brick wall and planting to front</text>
<text x="40" y="794" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Bedrooms 2–4 are c. 9.3 m² (single-bedroom size) – see notes</text>
<text x="40" y="816" font-size="12" text-anchor="start" font-weight="normal" fill="#000">• Cycle and bin storage to be shown in side/rear garden (TBC)</text>
